services:
  postgres:
    image: postgres:16
    container_name: fortiweb_inventory_db
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fortiweb_inventory}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fortiweb_inventory}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
